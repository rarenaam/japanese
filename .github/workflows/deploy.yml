name: Deploy Vite App

on:
  push:
    branches: ["main"] # Dubbelcheck: heet je branch 'main' of 'master'?

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        # We gebruiken 'working-directory' zodat alle commando's IN de map draaien
        run: |
          npm install
          npm run build
        working-directory: ./japanese 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # We pakken de dist map die Vite IN de japanese map heeft gemaakt
          path: ./japanese/dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
